<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real 64 mT vs 3T MRI registration viewer</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  main { flex: 1; display: flex; gap: 8px; padding: 8px; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line);
          border-radius: var(--radius); overflow: hidden; background: #050506; }
  .pane-head { display: flex; align-items: baseline; gap: 10px; padding: 9px 14px;
               border-bottom: 1px solid var(--line); background: var(--surface); }
  .pane-head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
  .pane-head .meta { font-size: 12px; color: var(--muted); }
  .pane-head .legend { margin-left: auto; font-size: 12px; color: var(--muted);
                       display: inline-flex; align-items: center; gap: 7px; }
  .pane .wrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; padding: 7px 16px;
           border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
           font-variant-numeric: tabular-nums; }
  footer b { color: var(--text); font-weight: 600; }
  #loc { font-family: var(--mono); font-size: 11.5px; white-space: pre; }
  #stats { margin-left: auto; }
  /* Slice bar: one slider per 2D plane on screen */
  .slicebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; margin: 0 8px;
              padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--radius);
              background: var(--surface); }
  .slicebar[hidden] { display: none; }
  .slicerow { display: flex; align-items: center; gap: 12px; flex: 1 1 240px; min-width: 200px; }
  .slicerow .label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
                     color: var(--faint); min-width: 62px; }
  .slicerow .num { font: 12px var(--mono); color: var(--text); min-width: 66px; text-align: right; }
  .slicebar .hint { font-size: 12px; color: var(--faint); white-space: nowrap; }
  input[type="range"] { flex: 1; appearance: none; -webkit-appearance: none; height: 4px; margin: 0;
                        border-radius: 2px; cursor: pointer;
                        background: linear-gradient(to right, var(--accent) var(--pos, 50%), var(--line-strong) var(--pos, 50%)); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
                        background: var(--accent); border: 0; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12); }
  input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
                        border: 0; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12); }
  @media (max-width: 700px) { .slicebar .hint { display: none; } }
  /* The outline toggle is a state, not an action: a quieter "on" than the white primary button */
  #btnEdges.on { background: var(--surface-2); color: var(--text); border-color: rgba(255, 255, 255, 0.45); }
  @media (max-width: 900px) { main { flex-direction: column; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <b>64 mT ↔ 3T</b>
    <span>Portable low-field MRI registered to 3T</span>
  </div>

  <div class="field">
    <label for="subject">Subject</label>
    <select id="subject" title="The 11 volunteers scanned on both machines (mean self-consistency error)"></select>
  </div>

  <div class="field">
    <label for="contrast">64 mT scan</label>
    <select id="contrast" title="Which 64 mT scan is shown. Each was registered to the same 3T T1 on its own."></select>
  </div>

  <div class="field">
    <span class="label">Position</span>
    <div class="segmented" role="group" aria-label="64 mT position">
      <button id="btnBefore">Before</button>
      <button id="btnAfter" class="on">After</button>
    </div>
    <button id="btnFlicker" title="Alternate before/after every 0.6 s">Flicker</button>
  </div>

  <div class="field">
    <span class="label">Views</span>
    <div class="segmented" id="views" role="group" aria-label="Views to show"
         title="Pick any combination; at least one stays on">
      <button data-view="axial">Axial</button>
      <button data-view="coronal">Coronal</button>
      <button data-view="sagittal">Sagittal</button>
      <button data-view="3d">3D</button>
    </div>
  </div>

  <button id="btnEdges" class="on" title="3T outlines on the 64 mT scan (key: O)">
    <span class="swatch"></span>3T outlines <span class="kbd">O</span>
  </button>

  <div class="spacer"></div>
  <a class="btn primary" href="info.html" title="All results tables and extra checks">Results →</a>
</header>

<main>
  <section class="pane">
    <div class="pane-head">
      <h2>64 mT <span id="lowName">T2</span></h2>
      <span class="meta">Hyperfine Swoop · <span id="lowVox">1.6 × 1.6 × 5</span> mm</span>
      <span class="legend"><span class="swatch"></span>3T edges</span>
    </div>
    <div class="wrap"><canvas id="glLow"></canvas></div>
  </section>
  <section class="pane">
    <div class="pane-head">
      <h2>3T T1</h2>
      <span class="meta">Philips Achieva · 1 mm</span>
      <span class="legend">Views are linked</span>
    </div>
    <div class="wrap"><canvas id="glT1"></canvas></div>
  </section>
</main>

<div class="slicebar" id="slicebar" hidden></div>

<footer>
  <span id="status">Loading…</span>
  <span id="loc" title="Crosshair position in the 3T scanner's coordinates (x = left-right, y = back-front, z = foot-head) and the slice in each plane"></span>
  <span id="stats"></span>
</footer>

<script type="module">
import { Niivue, SLICE_TYPE, SHOW_RENDER } from "https://cdn.jsdelivr.net/npm/@niivue/niivue@0.69.0/dist/index.js";

const $ = (id) => document.getElementById(id);

// Left view: 64 mT scan in gray with the 3T outlines on top.
// NiiVue draws everything on the voxel grid of the first (base) volume, so the base is an
// all-black copy of the 1 mm 3T scan. That keeps the outlines sharp and puts both views on
// the same grid, so their crosshairs line up exactly. The two 64 mT files hold the same
// voxels; only their headers (position/orientation) differ.
const BASE = 0, BEFORE = 1, AFTER = 2, EDGES = 3;   // volume indices in the left view
const MULTIPLANAR_GRID = 2;                          // NiiVue MULTIPLANAR_TYPE.GRID

const opts = {
  backColor: [0.02, 0.02, 0.024, 1],   // matches the pane background
  show3Dcrosshair: true,
  isOrientCube: true,
  multiplanarShowRender: SHOW_RENDER.ALWAYS,
  crosshairColor: [1, 1, 1, 0.55],
};
const nvLow = new Niivue(opts);
const nvT1 = new Niivue(opts);
window.viewer = { nvLow, nvT1 };   // handy for poking at from the browser console

const ramp = (r, g, b) => ({ R: [0, r], G: [0, g], B: [0, b], A: [0, 255], I: [0, 255] });
for (const nv of [nvLow, nvT1]) {
  nv.addColormap("black", ramp(0, 0, 0));
  nv.addColormap("white", ramp(255, 255, 255));   // gray ramp that is transparent at 0
  nv.addColormap("edge", { R: [0, 255], G: [0, 212], B: [0, 0], A: [0, 255], I: [0, 255] });
}

let showAfter = true, edgesOn = true, flickerTimer = null;

// Which views are on screen: any combination of the three planes and the 3D render.
// Outlines are on by default. With 3D on screen they also cover the 64 mT render in a yellow
// skin, because a NiiVue view holds all its layers in one 3D texture and can't hide them in the
// 3D tile alone. The button / O key turns them off there.
// NiiVue keeps volumes in RAS order: x = left-right (sagittal), y = back-front (coronal),
// z = foot-head (axial); `axis` is the one each plane steps through.
const PLANES = [
  { key: "axial",    type: SLICE_TYPE.AXIAL,    axis: 2, name: "Axial" },
  { key: "coronal",  type: SLICE_TYPE.CORONAL,  axis: 1, name: "Coronal" },
  { key: "sagittal", type: SLICE_TYPE.SAGITTAL, axis: 0, name: "Sagittal" },
  { key: "3d",       type: SLICE_TYPE.RENDER,               name: "3D" },
];
const DEFAULT_VIEWS = ["axial", "coronal", "sagittal"];
// Links made before the view picker used ?view=...
const LEGACY_VIEW = { mpr: DEFAULT_VIEWS, mpr3d: [...DEFAULT_VIEWS, "3d"], 0: ["axial"],
                      1: ["coronal"], 2: ["sagittal"], 4: ["3d"] };
let views = new Set(DEFAULT_VIEWS);
const shownPlanes = () => PLANES.filter((p) => views.has(p.key));
const CONTRAST_NAMES = { T2w: "T2", FLAIR: "FLAIR", T1w: "T1" };

function applyVisibility() {
  nvLow.setOpacity(BEFORE, showAfter ? 0 : 1);
  nvLow.setOpacity(AFTER, showAfter ? 1 : 0);
  // In 3D the outlines become a cluttered yellow skin, so they only show on the 2D slices.
  nvLow.setOpacity(EDGES, edgesOn && shownPlanes().some((p) => p.axis !== undefined) ? 1 : 0);
  $("btnBefore").classList.toggle("on", !showAfter);
  $("btnAfter").classList.toggle("on", showAfter);
  $("btnEdges").classList.toggle("on", edgesOn);
  updateUrl();
}

// Keep the address bar in step with what's on screen, so a copied link reopens the same view.
function updateUrl() {
  const q = new URLSearchParams(location.search);
  if ($("subject").value) q.set("subject", $("subject").value);
  if ($("contrast").value === defaultContrast) q.delete("contrast"); else q.set("contrast", $("contrast").value);
  if (showAfter) q.delete("lf"); else q.set("lf", "before");
  q.delete("outlines");   // not kept in the link: outlines always start on
  q.delete("view");
  const keys = shownPlanes().map((p) => p.key).join(",");
  if (keys === DEFAULT_VIEWS.join(",")) q.delete("views"); else q.set("views", keys);
  history.replaceState(null, "", "?" + q.toString());
}

function setShowAfter(v) { showAfter = v; applyVisibility(); }

function stopFlicker() {
  clearInterval(flickerTimer); flickerTimer = null;
  $("btnFlicker").classList.remove("on");
}

// Tile positions (left, top, width, height as fractions of the view) for n views.
function tiles(n, aspect) {
  const grid = [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]];
  if (n === 2) return aspect >= 1 ? [[0, 0, 0.5, 1], [0.5, 0, 0.5, 1]] : [[0, 0, 1, 0.5], [0, 0.5, 1, 0.5]];
  if (n === 3 && aspect >= 1.8) return [[0, 0, 1 / 3, 1], [1 / 3, 0, 1 / 3, 1], [2 / 3, 0, 1 / 3, 1]];
  return grid.slice(0, n);
}

function applyView() {
  const list = shownPlanes();
  const box = $("glLow").parentElement;
  const pos = tiles(list.length, box.clientWidth / Math.max(1, box.clientHeight));
  for (const nv of [nvLow, nvT1]) {
    if (list.length === 1) {
      nv.clearCustomLayout();
      nv.setSliceType(list[0].type);
    } else {
      nv.setSliceType(SLICE_TYPE.MULTIPLANAR);
      nv.setCustomLayout(list.map((p, i) => ({ sliceType: p.type, position: pos[i] })));
    }
  }
  for (const b of $("views").querySelectorAll("button")) {
    b.classList.toggle("on", views.has(b.dataset.view));
    b.setAttribute("aria-pressed", views.has(b.dataset.view));
  }
  applyVisibility();
  buildSliceBar();
}

$("btnBefore").onclick = () => { stopFlicker(); setShowAfter(false); };
$("btnAfter").onclick  = () => { stopFlicker(); setShowAfter(true); };
$("btnFlicker").onclick = () => {
  if (flickerTimer) return stopFlicker();
  $("btnFlicker").classList.add("on");
  flickerTimer = setInterval(() => setShowAfter(!showAfter), 600);
};
$("btnEdges").onclick = () => { edgesOn = !edgesOn; applyVisibility(); };
for (const b of $("views").querySelectorAll("button")) {
  b.onclick = () => {
    const k = b.dataset.view;
    if (views.has(k) && views.size === 1) return;   // keep at least one view
    if (views.has(k)) views.delete(k); else views.add(k);
    applyView();
  };
}
// Two or three tiles are laid out by the panel's shape, so redo the layout after a resize.
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(applyView, 150); });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "o" || e.key === "O") $("btnEdges").click();
});

// Slice bar: one slider per 2D plane on screen. Both views share the same base grid (the 1 mm
// 3T scan), so one fractional crosshair position means the same slice in both.
const sliceCount = (axis) => nvLow.volumes[0]?.dimsRAS?.[axis + 1];
const sliceIndex = (axis, n) =>
  Math.min(n - 1, Math.max(0, Math.round(nvLow.scene.crosshairPos[axis] * n - 0.5)));

function buildSliceBar() {
  const planes = shownPlanes().filter((p) => p.axis !== undefined);
  $("slicebar").hidden = !planes.length;
  $("slicebar").innerHTML = planes.map((p) =>
    `<div class="slicerow"><span class="label">${p.name}</span>` +
    `<input type="range" min="0" step="1" data-axis="${p.axis}" aria-label="${p.name} slice"` +
    ` title="Drag, or click and use the arrow keys"><span class="num"></span></div>`).join("") +
    '<span class="hint">or scroll on the image</span>';
  for (const input of $("slicebar").querySelectorAll("input")) {
    input.oninput = () => {
      const axis = Number(input.dataset.axis), n = sliceCount(axis);
      if (!n) return;
      for (const nv of [nvLow, nvT1]) {
        nv.scene.crosshairPos[axis] = (Number(input.value) + 0.5) / n;   // middle of the slice
        nv.drawScene();
      }
      updateLocation();
    };
  }
  updateLocation();
}

// Footer readout and slider positions, from the shared crosshair.
function updateLocation() {
  if (!nvLow.volumes.length) return;
  for (const input of $("slicebar").querySelectorAll("input")) {
    const axis = Number(input.dataset.axis), n = sliceCount(axis);
    if (!n) continue;
    const i = sliceIndex(axis, n);
    input.max = n - 1;
    input.value = i;
    input.style.setProperty("--pos", `${(100 * i) / Math.max(1, n - 1)}%`);
    input.nextElementSibling.textContent = `${i + 1} / ${n}`;
  }
  const mm = nvLow.frac2mm(nvLow.scene.crosshairPos);
  const num = (v) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
  const slices = PLANES.filter((p) => p.axis !== undefined)
    .map((p) => `${p.name.toLowerCase()} ${sliceIndex(p.axis, sliceCount(p.axis)) + 1}`).join(" · ");
  $("loc").textContent = `x ${num(mm[0])}  y ${num(mm[1])}  z ${num(mm[2])} mm  ·  slice ${slices}`;
}

const showLoc = () => updateLocation();
nvLow.onLocationChange = showLoc;
nvT1.onLocationChange = showLoc;

let subjects = [], defaultContrast = "T2w";

const statsFor = (subject, contrast) =>
  subjects.find((x) => x.subject === subject)?.contrasts[contrast];

function showStats(subject, contrast) {
  const r = statsFor(subject, contrast);
  if (!r) return;
  $("stats").innerHTML =
    `MI <b>${r.mi_before} → ${r.mi_after}</b> · ` +
    `self-consistency <b>${r.self_consistency_mean_mm} mm</b> mean, ` +
    `<b>${r.self_consistency_max_mm} mm</b> worst`;
}

// Menu labels follow the other menu: subjects show their error for the chosen contrast, and
// contrasts a subject doesn't have are greyed out.
function refreshMenus() {
  const subject = $("subject").value, contrast = $("contrast").value;
  for (const o of $("subject").options) {
    const r = statsFor(o.value, contrast);
    o.textContent = r ? `${o.value} · ${r.self_consistency_mean_mm} mm` : `${o.value} · no ${CONTRAST_NAMES[contrast]}`;
    o.disabled = !r;
  }
  for (const o of $("contrast").options) {
    const r = statsFor(subject, o.value);
    o.textContent = CONTRAST_NAMES[o.value] + (r ? "" : " (not scanned)");
    o.disabled = !r;
  }
}

const setMenusDisabled = (v) => { $("subject").disabled = v; $("contrast").disabled = v; };

// Load one subject's files for one 64 mT contrast into the two views. Each subject has its own folder.
async function loadSubject(subject, contrast) {
  setMenusDisabled(true);
  $("status").textContent = `Loading ${subject}, 64 mT ${CONTRAST_NAMES[contrast]}…`;
  const d = `data/${subject}/`, lf = `lowfield_${contrast}`;
  await Promise.all([
    nvLow.loadVolumes([
      { url: d + "t1_3t.nii.gz",        name: "t1_3t.nii.gz",        colormap: "black", cal_min: 20, cal_max: 255 },
      { url: d + `${lf}_before.nii.gz`, name: `${lf}_before.nii.gz`, colormap: "white", cal_min: 0,  cal_max: 255 },
      { url: d + `${lf}_after.nii.gz`,  name: `${lf}_after.nii.gz`,  colormap: "white", cal_min: 0,  cal_max: 255 },
      { url: d + "t1_3t_edges.nii.gz",  name: "t1_3t_edges.nii.gz",  colormap: "edge",  cal_min: 0,  cal_max: 255 },
    ]),
    nvT1.loadVolumes([
      { url: d + "t1_3t.nii.gz", name: "t1_3t.nii.gz", colormap: "gray", cal_min: 0, cal_max: 255 },
    ]),
  ]);
  $("subject").value = subject;
  $("contrast").value = contrast;
  $("lowName").textContent = CONTRAST_NAMES[contrast];
  refreshMenus();
  // Voxel size as stored in this subject's 64 mT file (sub-0064's is interpolated to 0.8 mm)
  const px = nvLow.volumes[AFTER].hdr.pixDims.slice(1, 4);
  $("lowVox").textContent = px.map((v) => +v.toFixed(2)).join(" × ");
  applyVisibility();
  applyView();
  showStats(subject, contrast);
  updateUrl();
  setMenusDisabled(false);
  $("status").textContent = "Click to move the crosshair · scroll for slices · drag in 3D to rotate";
}

$("subject").onchange = () => loadSubject($("subject").value, $("contrast").value).catch(loadFailed);
$("contrast").onchange = () => loadSubject($("subject").value, $("contrast").value).catch(loadFailed);

function loadFailed(err) {
  console.error(err);
  setMenusDisabled(false);
  $("status").textContent = "Failed to load volumes. Serve this folder over HTTP " +
    "(python -m http.server -d docs 8000), don't open the file directly.";
}

async function main() {
  await nvLow.attachToCanvas($("glLow"));
  await nvT1.attachToCanvas($("glT1"));

  // Link the two views both ways: crosshair, slice, zoom/pan and 3D rotation follow each other.
  const sync = { "2d": true, "3d": true, crosshair: true, zoomPan: true, sliceType: true };
  nvLow.broadcastTo(nvT1, sync);
  nvT1.broadcastTo(nvLow, sync);

  const list = await (await fetch("data/subjects.json")).json();
  subjects = list.subjects;
  defaultContrast = list.default_contrast;
  for (const r of subjects) $("subject").append(new Option(r.subject, r.subject));
  for (const c of list.contrasts) $("contrast").append(new Option(CONTRAST_NAMES[c], c));

  // Optional URL settings, e.g. index.html?subject=sub-0046&contrast=FLAIR&lf=before&views=axial,3d
  const q = new URLSearchParams(location.search);
  const wanted = q.has("views") ? q.get("views").split(",") : LEGACY_VIEW[q.get("view")] ?? DEFAULT_VIEWS;
  views = new Set(wanted.filter((k) => PLANES.some((p) => p.key === k)));
  if (!views.size) views = new Set(DEFAULT_VIEWS);
  showAfter = q.get("lf") !== "before";
  let subject = q.get("subject"), contrast = q.get("contrast");
  if (!subjects.some((r) => r.subject === subject)) subject = list.default;
  if (!statsFor(subject, contrast)) contrast = statsFor(subject, defaultContrast) ? defaultContrast
    : Object.keys(subjects.find((r) => r.subject === subject).contrasts)[0];
  await loadSubject(subject, contrast);
}

main().catch(loadFailed);
</script>
</body>
</html>
