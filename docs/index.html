<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real 64 mT vs 3T MRI registration viewer</title>
<style>
  :root { --bg: #111; --panel: #1c1c1c; --text: #ddd; --muted: #999; --edge: #ffd400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 14px; background: var(--panel); display: flex; flex-wrap: wrap;
           gap: 18px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
  .group { display: flex; gap: 6px; align-items: center; }
  .group > span { color: var(--muted); }
  button { background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 4px;
           padding: 4px 10px; cursor: pointer; font: inherit; }
  button.on { background: #555; border-color: #aaa; color: #fff; }
  select { font: inherit; }
  main { flex: 1; display: flex; gap: 4px; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane h2 { margin: 0; padding: 5px 10px; font-size: 13px; font-weight: 600; background: #181818; }
  .pane h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .pane .wrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  footer { padding: 6px 14px; background: var(--panel); color: var(--muted); display: flex;
           flex-wrap: wrap; gap: 18px; font-variant-numeric: tabular-nums; }
  footer b { color: var(--text); font-weight: 600; }
  .edge { color: var(--edge); }
</style>
</head>
<body>
<header>
  <h1>64 mT vs 3T</h1>

  <div class="group">
    <span>Subject</span>
    <select id="subject" title="The 11 volunteers scanned on both machines (mean self-consistency error)"></select>
  </div>

  <div class="group">
    <span>64 mT position:</span>
    <button id="btnBefore">Before</button>
    <button id="btnAfter" class="on">After</button>
    <button id="btnFlicker" title="Alternate before/after every 0.6 s">Flicker</button>
  </div>

  <div class="group">
    <button id="btnEdges" class="on" title="3T outlines on the 64 mT scan (key: O)">3T outlines</button>
  </div>

  <div class="group">
    <span>View</span>
    <select id="view">
      <option value="mpr3d">3 planes + 3D</option>
      <option value="mpr">3 planes</option>
      <option value="0">Axial</option>
      <option value="1">Coronal</option>
      <option value="2">Sagittal</option>
      <option value="4">3D render</option>
    </select>
  </div>

  <div class="group">
    <span>The views are linked: click, scroll or rotate in either one.
      <span class="edge">Yellow lines</span> = edges of the 3T scan.</span>
  </div>
</header>

<main>
  <section class="pane">
    <h2>64 mT T2 <small>Hyperfine Swoop · <span id="lowVox">1.6 × 1.6 × 5</span> mm voxels</small></h2>
    <div class="wrap"><canvas id="glLow"></canvas></div>
  </section>
  <section class="pane">
    <h2>3T T1 <small>Philips Achieva · 1 mm voxels</small></h2>
    <div class="wrap"><canvas id="glT1"></canvas></div>
  </section>
</main>

<footer>
  <span id="status">Loading…</span>
  <span id="loc"></span>
  <span id="stats"></span>
</footer>

<script type="module">
import { Niivue, SLICE_TYPE, SHOW_RENDER } from "https://cdn.jsdelivr.net/npm/@niivue/niivue@0.69.0/dist/index.js";

const $ = (id) => document.getElementById(id);

// Left view: 64 mT scan in gray with the 3T outlines on top.
// NiiVue draws everything on the voxel grid of the first (base) volume, so the base is an
// all-black copy of the 1 mm 3T scan. That keeps the outlines sharp and puts both views on
// the same grid, so their crosshairs line up exactly. The two 64 mT files hold the same
// voxels; only their headers (position/orientation) differ.
const BASE = 0, BEFORE = 1, AFTER = 2, EDGES = 3;   // volume indices in the left view
const MULTIPLANAR_GRID = 2;                          // NiiVue MULTIPLANAR_TYPE.GRID

const opts = {
  backColor: [0.07, 0.07, 0.07, 1],
  show3Dcrosshair: true,
  isOrientCube: true,
  multiplanarShowRender: SHOW_RENDER.ALWAYS,
  crosshairColor: [0.2, 0.8, 1, 0.7],
};
const nvLow = new Niivue(opts);
const nvT1 = new Niivue(opts);
window.viewer = { nvLow, nvT1 };   // handy for poking at from the browser console

const ramp = (r, g, b) => ({ R: [0, r], G: [0, g], B: [0, b], A: [0, 255], I: [0, 255] });
for (const nv of [nvLow, nvT1]) {
  nv.addColormap("black", ramp(0, 0, 0));
  nv.addColormap("white", ramp(255, 255, 255));   // gray ramp that is transparent at 0
  nv.addColormap("edge", { R: [0, 255], G: [0, 212], B: [0, 0], A: [0, 255], I: [0, 255] });
}

let showAfter = true, edgesOn = true, flickerTimer = null;

// Outlines are on by default, except in "3 planes + 3D": a NiiVue view holds all its layers in
// one 3D texture, so they can't be hidden in the 3D tile alone and would cover the 64 mT render
// in a yellow skin. The button / O key still turns them on there.
const edgesDefault = () => $("view").value !== "mpr3d";

function applyVisibility() {
  nvLow.setOpacity(BEFORE, showAfter ? 0 : 1);
  nvLow.setOpacity(AFTER, showAfter ? 1 : 0);
  // In 3D the outlines become a cluttered yellow skin, so they only show on the 2D slices.
  nvLow.setOpacity(EDGES, edgesOn && $("view").value !== "4" ? 1 : 0);
  $("btnBefore").classList.toggle("on", !showAfter);
  $("btnAfter").classList.toggle("on", showAfter);
  $("btnEdges").classList.toggle("on", edgesOn);
  updateUrl();
}

// Keep the address bar in step with what's on screen, so a copied link reopens the same view.
function updateUrl() {
  const q = new URLSearchParams(location.search);
  if ($("subject").value) q.set("subject", $("subject").value);
  if (showAfter) q.delete("lf"); else q.set("lf", "before");
  if (edgesOn === edgesDefault()) q.delete("outlines"); else q.set("outlines", edgesOn ? "1" : "0");
  if ($("view").value === "mpr3d") q.delete("view"); else q.set("view", $("view").value);
  history.replaceState(null, "", "?" + q.toString());
}

function setShowAfter(v) { showAfter = v; applyVisibility(); }

function stopFlicker() {
  clearInterval(flickerTimer); flickerTimer = null;
  $("btnFlicker").classList.remove("on");
}

function applyView() {
  const v = $("view").value;
  for (const nv of [nvLow, nvT1]) {
    nv.setMultiplanarLayout(MULTIPLANAR_GRID);   // same 2x2 layout in both, so planes line up
    if (v === "mpr3d" || v === "mpr") {
      nv.opts.multiplanarShowRender = v === "mpr3d" ? SHOW_RENDER.ALWAYS : SHOW_RENDER.NEVER;
      nv.setSliceType(SLICE_TYPE.MULTIPLANAR);
    } else {
      nv.setSliceType(Number(v));
    }
  }
  applyVisibility();
}

$("btnBefore").onclick = () => { stopFlicker(); setShowAfter(false); };
$("btnAfter").onclick  = () => { stopFlicker(); setShowAfter(true); };
$("btnFlicker").onclick = () => {
  if (flickerTimer) return stopFlicker();
  $("btnFlicker").classList.add("on");
  flickerTimer = setInterval(() => setShowAfter(!showAfter), 600);
};
$("btnEdges").onclick = () => { edgesOn = !edgesOn; applyVisibility(); };
$("view").onchange = () => { edgesOn = edgesDefault(); applyView(); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "o" || e.key === "O") $("btnEdges").click();
});

const showLoc = (data) => { $("loc").textContent = data.string ?? ""; };
nvLow.onLocationChange = showLoc;
nvT1.onLocationChange = showLoc;

let subjects = [];

function showStats(subject) {
  const r = subjects.find((x) => x.subject === subject);
  if (!r) return;
  $("stats").innerHTML =
    `${r.subject} · MI <b>${r.mi_before} → ${r.mi_after}</b> · ` +
    `self-consistency error <b>${r.self_consistency_mean_mm} mm</b> mean, ` +
    `<b>${r.self_consistency_max_mm} mm</b> max`;
}

// Load one subject's four files into the two views. Each subject has its own folder.
async function loadSubject(subject) {
  $("subject").disabled = true;
  $("status").textContent = `Loading ${subject}…`;
  const d = `data/${subject}/`;
  await Promise.all([
    nvLow.loadVolumes([
      { url: d + "t1_3t.nii.gz",           name: "t1_3t.nii.gz",           colormap: "black", cal_min: 20, cal_max: 255 },
      { url: d + "lowfield_before.nii.gz", name: "lowfield_before.nii.gz", colormap: "white", cal_min: 0,  cal_max: 255 },
      { url: d + "lowfield_after.nii.gz",  name: "lowfield_after.nii.gz",  colormap: "white", cal_min: 0,  cal_max: 255 },
      { url: d + "t1_3t_edges.nii.gz",     name: "t1_3t_edges.nii.gz",     colormap: "edge",  cal_min: 0,  cal_max: 255 },
    ]),
    nvT1.loadVolumes([
      { url: d + "t1_3t.nii.gz", name: "t1_3t.nii.gz", colormap: "gray", cal_min: 0, cal_max: 255 },
    ]),
  ]);
  $("subject").value = subject;
  // Voxel size as stored in this subject's 64 mT file (sub-0064's is interpolated to 0.8 mm)
  const px = nvLow.volumes[AFTER].hdr.pixDims.slice(1, 4);
  $("lowVox").textContent = px.map((v) => +v.toFixed(2)).join(" × ");
  applyVisibility();
  applyView();
  showStats(subject);
  updateUrl();
  $("subject").disabled = false;
  $("status").textContent = "Click to move the crosshair · scroll to change slice · drag in 3D to rotate";
}

$("subject").onchange = () => {
  loadSubject($("subject").value).catch(loadFailed);
};

function loadFailed(err) {
  console.error(err);
  $("subject").disabled = false;
  $("status").textContent = "Failed to load volumes. Serve this folder over HTTP " +
    "(python -m http.server -d docs 8000), don't open the file directly.";
}

async function main() {
  await nvLow.attachToCanvas($("glLow"));
  await nvT1.attachToCanvas($("glT1"));

  // Link the two views both ways: crosshair, slice, zoom/pan and 3D rotation follow each other.
  const sync = { "2d": true, "3d": true, crosshair: true, zoomPan: true, sliceType: true };
  nvLow.broadcastTo(nvT1, sync);
  nvT1.broadcastTo(nvLow, sync);

  const list = await (await fetch("data/subjects.json")).json();
  subjects = list.subjects;
  for (const r of subjects) {
    const o = document.createElement("option");
    o.value = r.subject;
    o.textContent = `${r.subject} · ${r.self_consistency_mean_mm} mm`;
    $("subject").append(o);
  }

  // Optional URL settings, e.g. index.html?subject=sub-0046&lf=before&view=2&outlines=0
  const q = new URLSearchParams(location.search);
  if (q.has("view")) $("view").value = q.get("view");
  showAfter = q.get("lf") !== "before";
  edgesOn = q.has("outlines") ? q.get("outlines") !== "0" : edgesDefault();
  const wanted = q.get("subject");
  await loadSubject(subjects.some((r) => r.subject === wanted) ? wanted : list.default);
}

main().catch(loadFailed);
</script>
</body>
</html>
